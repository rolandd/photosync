[package]
name = "photosync"
version = "0.1.2"
edition = "2024"
authors = ["Roland Dreier <roland@kernel.org>"]
description = "Tool for copying photos from SD cards"
license = "MIT"
repository = "https://github.com/rolandd/photosync"
readme = "README.md"
keywords = ["photography", "exif", "organize", "photos", "sync"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
nom-exif = "3.6.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
walkdir = "2.5.0"
ratatui = "0.30.2"
chrono = "0.4.45"
dirs = "6.0.0"
crossterm = "0.29.0"
rustix = "1.1.4"

[dev-dependencies]
tempfile = "3"
