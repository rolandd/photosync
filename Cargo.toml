[package]
name = "photosync"
version = "0.1.2"
edition = "2024"
authors = ["Roland Dreier <roland@kernel.org>"]
description = "Tool for copying photos from SD cards"
license = "MIT"
repository = "https://github.com/rolandd/photosync"
readme = "README.md"
keywords = ["photography", "exif", "organize", "photos", "sync"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.54", features = ["derive"] }
nom-exif = "2.7.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.10"
walkdir = "2"
ratatui = "0.30.0"
chrono = "0.4.42"
dirs = "6.0.0"
crossterm = "0.29.0"
fastrand = "2.3.0"

[dev-dependencies]
tempfile = "3"
